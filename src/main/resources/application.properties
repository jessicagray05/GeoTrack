spring.application.name=geotrack

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/geotrack}
spring.datasource.username=${DATABASE_USERNAME:jessicagray}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0