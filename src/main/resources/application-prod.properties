# =========================
# GEOTRACK PRODUCTION
# =========================

# Render supplies the web service port.
# Falls back to 8080 when running locally.
server.port=${PORT:8080}

# Database credentials must be supplied by the production environment
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns production database schema migrations.
# Production databases must be created from GeoTrack's migration history.
spring.flyway.baseline-on-migrate=false

# Hibernate validates the schema but never creates or changes it.
spring.jpa.hibernate.ddl-auto=validate

# Keep SQL and unnecessary internals out of production logs
spring.jpa.show-sql=false

# Production session cookie security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# Do not expose detailed server errors to users
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false