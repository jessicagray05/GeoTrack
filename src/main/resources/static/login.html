<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GeoTrack Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f1f1f1;
            color: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            border-top: 5px solid #f28c28;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            color: #292929;
            font-size: 32px;
            letter-spacing: 2px;
        }

        .logo p {
            margin-top: 8px;
            color: #777777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #3b3b3b;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            background: #fafafa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f28c28;
            background: white;
        }

        .login-button {
            width: 100%;
            background: #f28c28;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .login-button:hover {
            background: #d97512;
        }

        .error-message {
            display: none;
            background: #ffe5e5;
            color: #b00020;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: #999999;
            font-size: 12px;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">

                <h1>GEOTRACK</h1>

                <p>
                    Geotechnical Project Management System
                </p>

            </div>

            <div
                id="errorMessage"
                class="error-message"
            >
                Invalid username or password.
            </div>

            <form action="/login" method="post">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>

            <div class="login-footer">
                GeoTrack © 2026
            </div>

        </div>

    </div>

    <script>

        const params = new URLSearchParams(
            window.location.search
        );

        if (params.get("error") === "true") {

            document.getElementById(
                "errorMessage"
            ).style.display = "block";

        }

    </script>

</body>

</html>
